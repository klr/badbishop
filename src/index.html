<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Bad Bishop</title>
  <style>
  * {
    box-sizing: border-box;
  }

  a {
    color: rgba(0, 0, 0, 0.75);

    transition: color 100ms linear;
  }

  a:hover {
    color: rgba(0, 0, 0, 1);
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font: 13px -apple-system, ".SFNSText-Regular", "San Francisco", "Roboto", "Segoe UI", "Helvetica Neue", "Lucida Grande", sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;

    color: #333;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  #wrapper {
    max-width: 400px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  #wrapper img {
    width: 100%;
  }
  </style>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
</head>
<body>
  <div id="wrapper">
    <img src="logo.png">
    <span>Bad Bishop AB • <a href="mailto:victoria@badbishop.se">victoria@badbishop.se</a></span>
  </div>
</body>
</html>
